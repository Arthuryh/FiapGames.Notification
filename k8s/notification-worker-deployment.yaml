apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: fiapgames/notification-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: notification-worker-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: notification-worker-config
                  key: RabbitMq__HostName
            - name: RabbitMq__Port
              valueFrom:
                configMapKeyRef:
                  name: notification-worker-config
                  key: RabbitMq__Port
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: notification-worker-secret
                  key: ConnectionStrings__DefaultConnection
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: notification-worker-secret
                  key: RabbitMq__UserName
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: notification-worker-secret
                  key: RabbitMq__Password
