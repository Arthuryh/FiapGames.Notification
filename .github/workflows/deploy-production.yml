name: Deploy Notification Function to Production

on:
  push:
    branches: [master, azureContainer]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run the ephemeral database migration job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-function-notification
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-fiapgames-prod
  AZURE_LOCATION: brazilsouth
  AZURE_SUBSCRIPTION_ID: 64f434dd-5cb0-4c01-971d-7e0e6ba4db9b
  CONTAINER_APP_ENVIRONMENT: cae-fiapgames-prod
  LEGACY_CONTAINER_APP_NAME: ca-notification-worker
  FUNCTION_APP_NAME: func-fcg-notify-64f434dd
  ACR_LOGIN_SERVER: acrfiapgamesprod64f434dd.azurecr.io
  IMAGE_NAME: notification-migrations
  KEY_VAULT_URI: https://kv-fiapgames-64f434dd.vault.azure.net/
  MANAGED_IDENTITY_RESOURCE_ID: /subscriptions/64f434dd-5cb0-4c01-971d-7e0e6ba4db9b/resourceGroups/rg-fiapgames-prod/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-fiapgames-workloads-prod
  MANAGED_IDENTITY_CLIENT_ID: dfff11eb-a350-4ccb-a466-dee3265a9bf1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Azure credentials
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          printf '%s' "$AZURE_CREDENTIALS_JSON" | jq -e '
            type == "object" and
            all(.clientId, .clientSecret, .subscriptionId, .tenantId;
              type == "string" and length > 0)
          ' >/dev/null
          echo "ARM_CLIENT_ID=$(jq -r .clientId <<<"$AZURE_CREDENTIALS_JSON")" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(jq -r .clientSecret <<<"$AZURE_CREDENTIALS_JSON")" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(jq -r .tenantId <<<"$AZURE_CREDENTIALS_JSON")" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID" >> "$GITHUB_ENV"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select target subscription
        run: az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Bootstrap Terraform state
        run: |
          set -euo pipefail
          STATE_ACCOUNT="stfcgtfstate64f434dd"
          az storage account create --name "$STATE_ACCOUNT" --resource-group "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" --sku Standard_LRS --min-tls-version TLS1_2 --output none
          KEY=$(az storage account keys list --account-name "$STATE_ACCOUNT" \
            --resource-group "$AZURE_RESOURCE_GROUP" --query '[0].value' --output tsv)
          az storage container create --name tfstate --account-name "$STATE_ACCOUNT" \
            --account-key "$KEY" --output none

      - name: Provision serverless infrastructure
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="storage_account_name=stfcgtfstate64f434dd" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=notification-serverless.tfstate" \
            -backend-config="resource_group_name=$AZURE_RESOURCE_GROUP"
          terraform fmt -check
          terraform validate
          terraform apply -auto-approve -input=false -var="subscription_id=$AZURE_SUBSCRIPTION_ID"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test and publish Function
        run: |
          dotnet test FiapGame.Notification.slnx --configuration Release
          dotnet publish src/2-Notification.Infrastructure/2-Notification.Infrastructure.csproj \
            --configuration Release --output ./publish

      - name: Detect database migration changes
        id: migration-changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_migrations }}" = "true" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- src/2-Notification.Infrastructure/Migrations; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ACR
        if: steps.migration-changes.outputs.required == 'true'
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build migration image
        if: steps.migration-changes.outputs.required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run database migrations
        if: steps.migration-changes.outputs.required == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
            ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
            ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)
            JOB_NAME="notification-mig-${GITHUB_RUN_ID:0:12}-${GITHUB_RUN_ATTEMPT}"
            trap 'az containerapp job delete -n "$JOB_NAME" -g "$AZURE_RESOURCE_GROUP" --yes --output none 2>/dev/null || true' EXIT
            az containerapp job create -n "$JOB_NAME" -g "$AZURE_RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" --trigger-type Manual \
              --replica-timeout 1800 --replica-retry-limit 2 \
              --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" --cpu 0.5 --memory 1Gi \
              --registry-server "$ACR_LOGIN_SERVER" --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" --args=--migrate \
              --env-vars ASPNETCORE_ENVIRONMENT=Production KeyVaultUri="$KEY_VAULT_URI" \
                AZURE_CLIENT_ID="$MANAGED_IDENTITY_CLIENT_ID" --output none
            JOB_ID=$(az containerapp job show -n "$JOB_NAME" -g "$AZURE_RESOURCE_GROUP" --query id -o tsv)
            BODY=$(jq -n --arg id "$MANAGED_IDENTITY_RESOURCE_ID" '{identity:{type:"UserAssigned",userAssignedIdentities:{($id):{}}}}')
            az rest --method PATCH --uri "https://management.azure.com${JOB_ID}?api-version=2025-01-01" --body "$BODY" --output none
            EXECUTION=$(az containerapp job start -n "$JOB_NAME" -g "$AZURE_RESOURCE_GROUP" --query name -o tsv)
            for attempt in $(seq 1 180); do
              STATUS=$(az containerapp job execution show -n "$JOB_NAME" -g "$AZURE_RESOURCE_GROUP" \
                --job-execution-name "$EXECUTION" --query properties.status -o tsv)
              echo "Migration status: $STATUS"
              [ "$STATUS" = Succeeded ] && exit 0
              [ "$STATUS" = Failed ] && exit 1
              sleep 10
            done
            exit 1

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ./publish

      - name: Validate functions and retire legacy worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            COUNT=$(az functionapp function list -g "$AZURE_RESOURCE_GROUP" -n "$FUNCTION_APP_NAME" \
              --query "length([?contains(name, 'PaymentNotificationFunction') || contains(name, 'AuthenticationNotificationFunction')])" -o tsv)
            [ "$COUNT" = "2" ] && break
            sleep 10
          done
          [ "$COUNT" = "2" ]
          az containerapp delete -n "$LEGACY_CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" --yes --output none 2>/dev/null || true
