name: Deploy Notification Service to Production

on:
  push:
    branches: [main, azureContainer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ca-notification-worker
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-fiapgames-prod
  CONTAINER_APP_ENVIRONMENT: cae-fiapgames-prod
  CONTAINER_APP_NAME: ca-notification-worker
  IMAGE_NAME: notification-worker
  ACR_LOGIN_SERVER: acrfiapgamesprodcec7f71a.azurecr.io
  KEY_VAULT_URI: https://kv-fiapgames-cec7f71a.vault.azure.net/
  MANAGED_IDENTITY_RESOURCE_ID: /subscriptions/cec7f71a-b642-403e-bd36-dfcf0467ced4/resourceGroups/rg-fiapgames-prod/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-fiapgames-workloads-prod
  MANAGED_IDENTITY_CLIENT_ID: e302d8a9-bdd4-4f92-b9a8-17e963a7a17c

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Azure credentials secret
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          test -n "$AZURE_CREDENTIALS_JSON"
          printf '%s' "$AZURE_CREDENTIALS_JSON" | jq -e '
            type == "object" and
            all(.clientId, .clientSecret, .subscriptionId, .tenantId;
              type == "string" and length > 0)
          ' > /dev/null

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run database migrations
        uses: azure/cli@v2
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          inlineScript: |
            set -euo pipefail
            : "${ACR_LOGIN_SERVER:?ACR_LOGIN_SERVER is required}"
            : "${ACR_USERNAME:?ACR_USERNAME is required}"
            : "${ACR_PASSWORD:?ACR_PASSWORD is required}"
            : "${KEY_VAULT_URI:?KEY_VAULT_URI is required}"
            : "${MANAGED_IDENTITY_RESOURCE_ID:?AZURE_MANAGED_IDENTITY_RESOURCE_ID is required}"
            : "${MANAGED_IDENTITY_CLIENT_ID:?AZURE_MANAGED_IDENTITY_CLIENT_ID is required}"

            IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
            JOB_NAME="notification-mig-${GITHUB_RUN_ID:0:12}-${GITHUB_RUN_ATTEMPT}"

            cleanup() {
              az containerapp job delete --name "$JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" --yes \
                --output none 2>/dev/null || true
            }
            trap cleanup EXIT

            az containerapp job create \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 1800 \
              --replica-retry-limit 2 \
              --replica-completion-count 1 \
              --parallelism 1 \
              --image "$IMAGE" \
              --cpu 0.5 \
              --memory 1Gi \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --env-vars ASPNETCORE_ENVIRONMENT=Production \
                KeyVaultUri="$KEY_VAULT_URI" \
                AZURE_CLIENT_ID="$MANAGED_IDENTITY_CLIENT_ID" \
              --args=--migrate \
              --output none

            JOB_RESOURCE_ID=$(az containerapp job show \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query id --output tsv)
            IDENTITY_BODY=$(jq -n --arg id "$MANAGED_IDENTITY_RESOURCE_ID" \
              '{identity:{type:"UserAssigned",userAssignedIdentities:{($id):{}}}}')
            az rest --method PATCH \
              --uri "https://management.azure.com${JOB_RESOURCE_ID}?api-version=2025-01-01" \
              --body "$IDENTITY_BODY" --output none

            EXECUTION_NAME=$(az containerapp job start \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query name --output tsv)

            test -n "$EXECUTION_NAME" || {
              echo "Migration job returned no execution name." >&2
              exit 1
            }

            for attempt in $(seq 1 180); do
              STATUS=$(az containerapp job execution show \
                --name "$JOB_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --job-execution-name "$EXECUTION_NAME" \
                --query properties.status --output tsv)

              echo "Migration status: $STATUS"
              case "$STATUS" in
                Succeeded) exit 0 ;;
                Failed|Stopped|Degraded|Unknown)
                  az containerapp job execution show \
                    --name "$JOB_NAME" \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --job-execution-name "$EXECUTION_NAME" \
                    --output json
                  exit 1
                  ;;
              esac
              sleep 10
            done

            echo "Migration timed out after 30 minutes." >&2
            exit 1

      - name: Prepare Container App identity
        run: |
          STATE=$(az containerapp show --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.provisioningState --output tsv 2>/dev/null || true)
          if [ "$STATE" = "Failed" ]; then
            az containerapp delete --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" --yes --output none
          fi
          if ! az containerapp show --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az containerapp create --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --image mcr.microsoft.com/azuredocs/containerapps-helloworld:latest \
              --ingress disabled --output none
          fi
          az containerapp identity assign \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --user-assigned "$MANAGED_IDENTITY_RESOURCE_ID" \
            --output none

      - name: Deploy revision
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: acrfiapgamesprodcec7f71a
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ingress: disabled
          environmentVariables: ASPNETCORE_ENVIRONMENT=Production KeyVaultUri=${{ env.KEY_VAULT_URI }} AZURE_CLIENT_ID=${{ env.MANAGED_IDENTITY_CLIENT_ID }}
